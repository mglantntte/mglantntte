<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <path d="M20,0 h820 a20,20 0 0 1 20,20 v260 a20,20 0 0 1 -20,20 h-820 a20,20 0 0 1 -20,-20 v-260 a20,20 0 0 1 20,-20"/>
    </clipPath>
    <radialGradient id="tsg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.35)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0)"/>
    </radialGradient>
    <radialGradient id="tsg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,229,255,0.30)"/>
      <stop offset="100%" stop-color="rgba(0,229,255,0)"/>
    </radialGradient>
    <radialGradient id="tsg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(51,102,255,0.30)"/>
      <stop offset="100%" stop-color="rgba(51,102,255,0)"/>
    </radialGradient>
    <style>
      @keyframes ts-orb1 { 0%, 100% { transform: translate(0,0); opacity: 0.4; } 50% { transform: translate(30px,-20px); opacity: 0.7; } }
      @keyframes ts-orb2 { 0%, 100% { transform: translate(0,0); opacity: 0.35; } 50% { transform: translate(-25px,15px); opacity: 0.6; } }
      #tso1 { animation: ts-orb1 10s ease-in-out infinite; }
      #tso2 { animation: ts-orb2 13s ease-in-out infinite 1s; }
      #tso3 { animation: ts-orb1 9s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Background -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="860" height="300" fill="#06060a"/>
    <ellipse id="tso1" cx="150" cy="220" rx="200" ry="160" fill="url(#tsg1)"/>
    <ellipse id="tso2" cx="700" cy="50"  rx="180" ry="140" fill="url(#tsg2)"/>
    <ellipse id="tso3" cx="430" cy="240" rx="160" ry="120" fill="url(#tsg3)"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="858" height="298" rx="20" ry="20"
        fill="none" stroke="rgba(139,92,246,0.08)" stroke-width="2"/>

  <!-- Header -->
  <text x="370" y="76" font-size="14" font-weight="700"
        fill="rgba(139,92,246,0.5)"
        font-family="'Consolas', 'Monaco', monospace"
        letter-spacing="1">TECH_STACK</text>

